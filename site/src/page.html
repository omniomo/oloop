<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{desc}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{desc}}" />
    <meta property="og:image" content="https://oloop.ooooomo.com/assets/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://oloop.ooooomo.com{{path}}" />
{{alternates}}
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="preload" href="/assets/fonts/FunnelDisplay-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <a class="brand" href="{{home}}"><img src="/assets/logo.svg" alt="" width="28" height="28" />Oloop</a>
        <a class="icon-link" href="https://github.com/omniomo/oloop" aria-label="GitHub">{{github_icon}}</a>
        <a class="pill get" href="https://chromewebstore.google.com/detail/oloop/hnfnnjcelkiojgpmenmknmpejjgndhlc">{{cta_store}}</a>
      </header>
{{main}}
      <footer>
        <a class="omo" href="https://ooooomo.com/" aria-label="Made by OMO">{{omo_logo}}</a>
        <a href="https://github.com/omniomo/oloop/issues">{{support}}</a>
        <a href="{{privacy_href}}">{{privacy}}</a>
        <span class="grow"></span>
        <details class="lang">
          <summary><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><ellipse cx="12" cy="12" rx="4" ry="9" /><path d="M3 12h18" /></svg><span class="sr">{{language}}: </span>{{lang_name}}</summary>
          <nav aria-label="{{language}}">{{lang_links}}</nav>
        </details>
        <span class="copy">© 2026 OMO Lab</span>
      </footer>
    </div>
    <script src="/site.js" defer></script>
  </body>
</html>
